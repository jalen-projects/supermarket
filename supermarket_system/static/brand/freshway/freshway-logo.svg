  <g fill="none" stroke="#256b40" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 388 V216 A80 80 0 0 1 250 136 H340"/>
    <path d="M170 264 H262"/>
  </g>
  <path d="M296 264 A36 36 0 1 0 368 264 A36 36 0 1 0 296 264 Z" fill="#df6a22"/>
  <path d="M333 228 C334 210 346 198 366 196 C364 214 352 226 333 228 Z" fill="#256b40"/>
</svg>
