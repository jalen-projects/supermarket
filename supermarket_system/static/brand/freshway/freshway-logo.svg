<!-- FRESHWAY SUPERMARKET, NAKAWA - primary mark (the demonstration shop).
     An F drawn as one shoot that rises and turns into its top bar, with an
     orange on the end of its middle bar. Green and orange on transparent,
     like MAQAM's: the sidebar puts a white chip behind it, and a solid tile
     prints heavy on a thermal roll. freshway-icon.svg is the filled tile. -->
