{% if page.has_other_pages %}
<div class="pager no-print">
  {% if page.has_previous %}
    <a class="btn btn-sm" href="?{{ qs }}page={{ page.previous_page_number }}">Previous</a>
  {% endif %}
  <span class="faint">Page {{ page.number }} of {{ page.paginator.num_pages }}
    ({{ page.paginator.count }} record{{ page.paginator.count|pluralize }})</span>
  {% if page.has_next %}
    <a class="btn btn-sm" href="?{{ qs }}page={{ page.next_page_number }}">Next</a>
  {% endif %}
</div>
{% endif %}
